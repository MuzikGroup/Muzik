name: Bump version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[no bump]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version by 0.0.1
        id: bump
        run: |
          VERSION=$(grep -oP '^muzik\.version=\K.*' gradle.properties)
          VERSION_CODE=$(grep -oP '^muzik\.versionCode=\K.*' gradle.properties)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_CODE=$((VERSION_CODE + 1))
          sed -i "s/^muzik\.version=.*/muzik.version=$NEW_VERSION/" gradle.properties
          sed -i "s/^muzik\.versionCode=.*/muzik.versionCode=$NEW_CODE/" gradle.properties
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped $VERSION -> $NEW_VERSION (code $NEW_CODE)"

      - name: Commit bump and dispatch release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "MuzikReleaseBot"
          git config user.email "311002533+Motius@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [no bump]"
          git push
          gh api "repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" -f ref=main
