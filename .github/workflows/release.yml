name: Build and release Muzik Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check_version
        run: |
          NEW_VERSION=$(grep -oP '^appVersion=\K.*' gradle.properties || echo "")
          if [ -z "$NEW_VERSION" ]; then
            echo "Could not read appVersion from gradle.properties"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Current version: $NEW_VERSION"

          if git show HEAD^:gradle.properties > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:gradle.properties | grep -oP '^appVersion=\K.*' || echo "")
            echo "Previous version: $OLD_VERSION"
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "Version changed from $OLD_VERSION to $NEW_VERSION"
              echo "version_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version unchanged: $NEW_VERSION"
              echo "version_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "First version detected: $NEW_VERSION"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  smoke:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build portable jar
        run: ./gradlew packageUberJarForCurrentOS --no-daemon

      - name: Run playback smoke
        run: |
          JAR=$(ls app/build/compose/jars/Muzik-*.jar | head -1)
          # SMOKE_OK        = full network + offline verification
          # SMOKE_PARTIAL   = YouTube gated the runner IP; offline player stack verified
          # non-zero exit   = real playback-stack bug, fails the release
          java -Djava.awt.headless=true -Xmx1024m -cp "$JAR" com.muzik.desktop.smoke.ParserTestKt
          timeout 600 java -Djava.awt.headless=true -Xmx1024m -cp "$JAR" com.muzik.desktop.smoke.SmokeKt

  build:
    needs: [check-version, smoke]
    if: needs.check-version.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: msi
          - os: macos-15
            target: dmg
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # The Windows WebView2 login helper is built from the in-repo .NET project
      # and shipped as an app resource (same pipeline Metrolist uses).
      - name: Build Windows WebView2 helper
        if: matrix.target == 'msi'
        shell: pwsh
        run: |
          dotnet publish metro-wv2-helper/metro-wv2-helper.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output desktopApp/src/desktopMain/resources/windows `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true

      - name: Install rpm tooling (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Windows MSI + portable ZIP
        if: matrix.target == 'msi'
        run: ./gradlew :desktopApp:packageReleaseMsi :desktopApp:assembleWindowsRelease --no-configuration-cache

      - name: Build macOS DMG (Apple Silicon)
        if: matrix.target == 'dmg'
        run: ./gradlew :desktopApp:packageReleaseDmg --no-configuration-cache

      - name: Build Linux DEB, RPM and portable JAR
        if: matrix.target == 'linux'
        run: ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm :desktopApp:packageReleaseUberJarForCurrentOS --no-configuration-cache

      - name: Normalize artifact names
        id: rename
        shell: bash
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          OUT_DIR="desktopApp/build/compose/binaries/main-release"
          DEST=""
          case "${{ matrix.target }}" in
            msi)
              FILE=$(find "$OUT_DIR/msi" -name "*.msi" | head -1)
              DEST="Muzik-$VERSION-windows-x64.msi"
              ZIP="dist/Muzik-Desktop-Windows.zip"
              if [ -f "$ZIP" ]; then
                cp "$ZIP" "Muzik-$VERSION-windows-x64.zip"
                echo "zip=Muzik-$VERSION-windows-x64.zip" >> "$GITHUB_OUTPUT"
              fi
              ;;
            dmg)
              FILE=$(find "$OUT_DIR/dmg" -name "*.dmg" | head -1)
              DEST="Muzik-$VERSION-macos-arm64.dmg"
              ;;
            linux)
              FILE=$(find "$OUT_DIR/deb" -name "*.deb" | head -1)
              DEST="muzik-$VERSION-linux-amd64.deb"
              if [ -n "$FILE" ]; then
                cp "$FILE" "$DEST"
                echo "renamed=$DEST" >> "$GITHUB_OUTPUT"
              fi
              RPM=$(find "$OUT_DIR/rpm" -name "*.rpm" | head -1)
              if [ -n "$RPM" ]; then
                cp "$RPM" "muzik-$VERSION-linux-x64.rpm"
                echo "rpm=muzik-$VERSION-linux-x64.rpm" >> "$GITHUB_OUTPUT"
              fi
              JAR=$(find desktopApp/build/compose/jars -name "Muzik-*.jar" | head -1)
              if [ -n "$JAR" ]; then
                cp "$JAR" "muzik-$VERSION-portable.jar"
                echo "jar=muzik-$VERSION-portable.jar" >> "$GITHUB_OUTPUT"
              fi
              if [ -z "$DEST" ] || [ ! -f "$DEST" ]; then
                echo "No deb found for linux target"
                exit 1
              fi
              exit 0
              ;;
          esac
          if [ -n "$FILE" ]; then
            cp "$FILE" "$DEST"
            echo "renamed=$DEST" >> "$GITHUB_OUTPUT"
          else
            echo "No installer found for ${{ matrix.target }}"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: muzik-${{ matrix.target }}-${{ needs.check-version.outputs.new_version }}
          path: |
            ${{ steps.rename.outputs.renamed }}
            ${{ matrix.target == 'linux' && steps.rename.outputs.rpm || '' }}
            ${{ matrix.target == 'linux' && steps.rename.outputs.jar || '' }}
            ${{ matrix.target == 'msi' && steps.rename.outputs.zip || '' }}
          if-no-files-found: error

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.new_version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Muzik Desktop v$VERSION" \
            --generate-notes \
            --notes "Muzik Desktop v$VERSION

          One-click installers for every desktop platform:
          - **Windows**: \`Muzik-$VERSION-windows-x64.msi\` (Windows 10/11, x64) plus a portable ZIP
          - **macOS**: \`Muzik-$VERSION-macos-arm64.dmg\` (Apple Silicon) — Intel Macs can use the portable JAR with Java 21+
          - **Linux**: \`muzik-$VERSION-linux-amd64.deb\` (Debian/Ubuntu/Mint), RPM for Fedora/openSUSE, and a portable JAR
          - **Any OS with Java 21+**: the portable \`muzik-$VERSION-portable.jar\`

          Unsigned builds: on Windows SmartScreen, choose *More info > Run anyway*.

          Built on the Metrolist desktop engine (GPL-3.0). Support Muzik: https://buymesoda.com/lllcuDCr25N1a1peiKOCl22Oaf13"
