name: Build and release Muzik

# One release, every platform: signed Android APKs (FOSS / Google Cast / Izzy)
# plus the Windows, macOS and Linux desktop installers, all cut from a single
# version line in app/build.gradle.kts (mirrored into desktop/gradle.properties
# by version_bump.yml).
on:
  push:
    branches:
      - "main"
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "File app/build.gradle.kts does not exist"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")

          if [ -z "$NEW_VERSION" ]; then
            echo "Could not find versionName in app/build.gradle.kts"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Current version: $NEW_VERSION (code: $VERSION_CODE)"

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[^"]+' || echo "")
            echo "Previous version: $OLD_VERSION"
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "Version changed from $OLD_VERSION to $NEW_VERSION"
              echo "version_changed=true" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged: $NEW_VERSION"
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "First version detected: $NEW_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

  android-build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Lint Release APK
        run: ./gradlew --console=plain clean assemble${{ matrix.variantName }}Release :app:lint${{ matrix.variantName }}Release --warning-mode summary
        env:
          MUZIK_APPLICATION_ID: com.muzikgroup.music
          MUZIK_ARCHITECTURE: universal
          MUZIK_APP_NAME: Muzik
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move and rename signed APKs
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"

          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)

          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK found for ${{ matrix.variant }}"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="Muzik-with-Google-Cast.apk"
          elif [ "${{ matrix.variant }}" = "izzy" ]; then
            TARGET_NAME="Muzik-izzy.apk"
          else
            TARGET_NAME="Muzik.apk"
          fi

          mv "$SIGNED_APK" "$OUTPUT_DIR/out/$TARGET_NAME"

          echo "APK renamed to: $TARGET_NAME"
          ls -la "$OUTPUT_DIR/out/"

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant == 'gms' && 'Muzik-with-Google-Cast' || matrix.variant == 'izzy' && 'Muzik-izzy' || 'Muzik' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*.apk

  desktop-smoke:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install smoke runtime libraries
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y xvfb scrot rpm \
              libasound2t64 libdrm2 libegl1 libfontconfig1 libfreetype6 libgl1 \
              libpulse0 libva-drm2 libva2 libx11-6 libxcb-shm0 && break
            echo "apt attempt $i failed — retrying in 20s"
            sleep 20
          done

      - name: Build Linux DEB
        run: ./gradlew :desktopApp:packageReleaseDeb --no-configuration-cache

      - name: Launch smoke test (real app under Xvfb)
        run: |
          DEB=$(find desktopApp/build/compose/binaries/main-release/deb -name "*.deb" | head -1)
          rm -rf smoke-pkg && mkdir smoke-pkg
          dpkg-deb -x "$DEB" smoke-pkg
          xvfb-run -a -s '-screen 0 1440x1000x24' python3 scripts/desktop_smoke.py smoke-pkg --output "$RUNNER_TEMP/desktop-smoke"

      - name: Collect smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muzik-smoke-${{ needs.check-version.outputs.new_version }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore

  desktop-build:
    needs: [check-version, desktop-smoke]
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: msi
          - os: macos-15
            target: dmg
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # The Windows WebView2 login helper is built from the in-repo .NET project
      # and shipped as an app resource.
      - name: Build Windows WebView2 helper
        if: matrix.target == 'msi'
        shell: pwsh
        run: |
          dotnet publish metro-wv2-helper/metro-wv2-helper.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output desktopApp/src/desktopMain/resources/windows `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true

      - name: Install rpm tooling (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Windows MSI + portable ZIP
        if: matrix.target == 'msi'
        run: ./gradlew :desktopApp:packageReleaseMsi :desktopApp:assembleWindowsRelease --no-configuration-cache

      - name: Build macOS DMG (Apple Silicon)
        if: matrix.target == 'dmg'
        run: ./gradlew :desktopApp:packageReleaseDmg --no-configuration-cache

      - name: Build Linux DEB, RPM and portable JAR
        if: matrix.target == 'linux'
        run: ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm :desktopApp:packageReleaseUberJarForCurrentOS --no-configuration-cache

      - name: Normalize artifact names
        id: rename
        shell: bash
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          OUT_DIR="desktopApp/build/compose/binaries/main-release"
          DEST=""
          case "${{ matrix.target }}" in
            msi)
              FILE=$(find "$OUT_DIR/msi" -name "*.msi" | head -1)
              DEST="Muzik-$VERSION-windows-x64.msi"
              ZIP="dist/Muzik-Desktop-Windows.zip"
              if [ -f "$ZIP" ]; then
                cp "$ZIP" "$GITHUB_WORKSPACE/Muzik-$VERSION-windows-x64.zip"
                echo "zip=$GITHUB_WORKSPACE/Muzik-$VERSION-windows-x64.zip" >> "$GITHUB_OUTPUT"
              fi
              ;;
            dmg)
              FILE=$(find "$OUT_DIR/dmg" -name "*.dmg" | head -1)
              DEST="Muzik-$VERSION-macos-arm64.dmg"
              ;;
            linux)
              FILE=$(find "$OUT_DIR/deb" -name "*.deb" | head -1)
              DEST="muzik-$VERSION-linux-amd64.deb"
              if [ -n "$FILE" ]; then
                cp "$FILE" "$GITHUB_WORKSPACE/$DEST"
                echo "renamed=$GITHUB_WORKSPACE/$DEST" >> "$GITHUB_OUTPUT"
              fi
              RPM=$(find "$OUT_DIR/rpm" -name "*.rpm" | head -1)
              if [ -n "$RPM" ]; then
                cp "$RPM" "$GITHUB_WORKSPACE/muzik-$VERSION-linux-x64.rpm"
                echo "rpm=$GITHUB_WORKSPACE/muzik-$VERSION-linux-x64.rpm" >> "$GITHUB_OUTPUT"
              fi
              JAR=$(find desktopApp/build/compose/jars -name "Muzik-*.jar" | head -1)
              if [ -n "$JAR" ]; then
                cp "$JAR" "$GITHUB_WORKSPACE/muzik-$VERSION-portable.jar"
                echo "jar=$GITHUB_WORKSPACE/muzik-$VERSION-portable.jar" >> "$GITHUB_OUTPUT"
              fi
              if [ -z "$DEST" ] || [ ! -f "$GITHUB_WORKSPACE/$DEST" ]; then
                echo "No deb found for linux target"
                exit 1
              fi
              exit 0
              ;;
          esac
          if [ -n "$FILE" ]; then
            cp "$FILE" "$GITHUB_WORKSPACE/$DEST"
            echo "renamed=$GITHUB_WORKSPACE/$DEST" >> "$GITHUB_OUTPUT"
          else
            echo "No installer found for ${{ matrix.target }}"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: muzik-${{ matrix.target }}-${{ needs.check-version.outputs.new_version }}
          path: |
            ${{ steps.rename.outputs.renamed }}
            ${{ matrix.target == 'linux' && steps.rename.outputs.rpm || '' }}
            ${{ matrix.target == 'linux' && steps.rename.outputs.jar || '' }}
            ${{ matrix.target == 'msi' && steps.rename.outputs.zip || '' }}
          if-no-files-found: error

  release:
    needs: [check-version, android-build, desktop-build]
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Drop smoke evidence from release assets
        run: rm -f dist/app.log dist/stdout.log dist/desktop.png dist/result.txt

      - name: Generate SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Parse release notes from changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          chmod +x .github/scripts/parse_changelog.sh

          if bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release_notes.md; then
            echo "Release notes sourced from changelog.md for v$VERSION"
          else
            echo "::warning::v$VERSION not found in changelog.md — falling back to git log"
            {
              echo "Release of version $VERSION"
              echo ""
              git log "$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD" \
                --pretty=format:"- %s" --no-merges | head -10 || echo "- Initial release"
            } > release_notes.md
          fi

          {
            echo ""
            echo "## Android"
            echo "- \`Muzik.apk\` — universal APK (FOSS build, no Google services)"
            echo "- \`Muzik-with-Google-Cast.apk\` — with Google Cast support"
            echo "- \`Muzik-izzy.apk\` — IzzyOnDroid build"
            echo ""
            echo "## Desktop"
            echo "One-click installers for every desktop platform:"
            echo "- **Windows**: \`Muzik-$VERSION-windows-x64.msi\` (Windows 10/11, x64) plus a portable ZIP"
            echo "- **macOS**: \`Muzik-$VERSION-macos-arm64.dmg\` (Apple Silicon) — Intel Macs can use the portable JAR with Java 21+"
            echo "- **Linux**: \`muzik-$VERSION-linux-amd64.deb\` (Debian/Ubuntu/Mint), RPM for Fedora/openSUSE, and a portable JAR"
            echo "- **Any OS with Java 21+**: the portable \`muzik-$VERSION-portable.jar\`"
            echo "- Verify any download with the attached \`SHA256SUMS\` checksum file"
            echo ""
            echo "Unsigned builds: on Windows SmartScreen, choose *More info > Run anyway*."
            echo ""
            echo "Built by Ignatius and the Pipo Team (GPL-3.0). Support Muzik: https://buymesoda.com/lllcuDCr25N1a1peiKOCl22Oaf13"
          } >> release_notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating unified release v${{ needs.check-version.outputs.new_version }}"

          {
            echo "Released by @${{ github.triggering_actor }}"
            echo ""
            cat release_notes.md
          } > attributed_release_notes.md

          ls -la dist/

          gh release create "v${{ needs.check-version.outputs.new_version }}" dist/* \
            --title "Muzik v${{ needs.check-version.outputs.new_version }}" \
            --notes-file attributed_release_notes.md \
            --latest

          echo "Release created successfully!"

      - name: Update release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ needs.check-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ needs.check-version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Released by**: @${{ github.triggering_actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Assets**: $(ls dist/* 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
