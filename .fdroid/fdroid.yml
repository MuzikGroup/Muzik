AutoName: Muzik
Summary: Material 3 YouTube Music client for Android
Description: |-
  Muzik is a free, open-source YouTube Music client for Android with a
  Material 3 design. Play any song or video from YouTube Music, download and
  cache songs for offline playback, sync playlists to your account, and more.
  No Google services are required.

  Features:
  - Play any song or video from YouTube Music
  - Background playback
  - Personalized quick picks
  - Downloads and offline caching
  - Account syncing of songs, artists, albums and playlists
  - Live lyrics
  - Audio normalization, skip silence, tempo/pitch controls
  - Sleep timer
  - Light, Dark, Black and Dynamic themes

