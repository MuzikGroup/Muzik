org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Muzik Desktop release versioning.
# release.yml publishes installers whenever muzik.version changes.
# version_bump.yml raises the patch by 0.0.1 on every push to main
# unless the head commit message contains "[no bump]".
muzik.version=7.8.7
muzik.versionCode=70807
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk-amd64
