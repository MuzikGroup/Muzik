# Keep local build daemons bounded.
# Kotlin and lint run inside the Gradle daemon, so cap parallel workers along with its heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
# A separate Kotlin daemon would hold a second compiler heap next to Gradle's.
kotlin.compiler.execution.strategy=in-process
# Stop idle daemons after 30 minutes instead of three hours.
org.gradle.daemon.idletimeout=1800000
org.gradle.unsafe.configuration-cache=true
# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Increase timeouts for JitPack downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Enable Gradle task output caching
org.gradle.caching=true

# Kotlin compilation performance
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Muzik Desktop release versioning.
# release.yml publishes installers whenever appVersion changes.
# version_bump.yml raises the patch by 0.0.1 on every push to main
# unless the head commit message contains "[no bump]".
appVersion=8.2.3
innerTubeXVersion=v0.12.0-muzik.1

# Retry downloads when Maven Central rate-limits (HTTP 429): the protoc tool
# resolves straight from Central, and occasional CI throttling must not fail
# a release build.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
